<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beachouse - Go Live</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Inline styles removed -->
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="listener.html" class="nav-brand">Beachouse</a>
            <ul class="nav-links">
                <li class="nav-item"><a href="listener.html" class="nav-link">Listen</a></li>
                <li class="nav-item"><a href="broadcaster.html" class="nav-link">Go Live</a></li>
                <li class="nav-item auth-link-login"><a href="login.html" class="nav-link">Login</a></li>
                <li class="nav-item auth-link-register"><a href="register.html" class="nav-link">Register</a></li>
                <!-- Logout link and user info will be added dynamically later -->
            </ul>
        </div>
    </nav>
    <div class="page-container">
        <div class="user-info" style="text-align: right; margin-bottom: var(--spacing-unit);">Logged in as: <span id="loggedInUsername">Guest</span></div>
        
        <div class="content-section">
            <h2>Start Your Live Broadcast</h2> <!-- Changed H1 to H2 -->
            
            <div class="start-stream-form">
                <label for="streamName" class="sr-only">Stream Name (Optional):</label> <!-- Screen-reader only label -->
                <input type="text" id="streamName" placeholder="Enter Stream Name (Optional)">
                <button id="goLiveButton" class="btn" disabled>Go Live</button>
                <span id="liveIndicator" class="live-indicator" style="display: none;">LIVE</span>
            </div>
            
            <div id="statusMessages" class="message-feedback" style="margin-top: var(--spacing-unit);">Not connected.</div>
            
            <div id="currentStreamInfo" style="display: none; margin-top: var(--spacing-unit);">
                <p>Streaming as: <strong id="currentStreamNameDisplay"></strong></p>
            </div>
        </div>
    </div>

    <script src="broadcaster.js"></script>
    <script src="/js/nav.js" defer></script>
</body>
</html>
