<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beachouse - Login</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Inline styles removed -->
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="listener.html" class="nav-brand">Beachouse</a>
            <ul class="nav-links">
                <li class="nav-item"><a href="listener.html" class="nav-link">Listen</a></li>
                <li class="nav-item"><a href="broadcaster.html" class="nav-link">Go Live</a></li>
                <li class="nav-item auth-link-login"><a href="login.html" class="nav-link">Login</a></li>
                <li class="nav-item auth-link-register"><a href="register.html" class="nav-link">Register</a></li>
                <!-- Logout link and user info will be added dynamically later -->
            </ul>
        </div>
    </nav>
    <div class="auth-container">
        <h2>Login to your Beachouse Account</h2> <!-- Changed H1 to H2 -->
        <form id="loginForm">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p id="messageArea" class="message-feedback"></p> <!-- Added class -->
        <p class="auth-link"><a href="register.html">Don't have an account? Register</a></p> <!-- Added class -->
    </div>
    <script src="login.js"></script>
    <script src="/js/nav.js" defer></script>
</body>
</html>
