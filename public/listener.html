<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beachouse - Watch a Stream</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Inline styles removed -->
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="listener.html" class="nav-brand">Beachouse</a>
            <ul class="nav-links">
                <li class="nav-item"><a href="listener.html" class="nav-link">Listen</a></li>
                <li class="nav-item"><a href="broadcaster.html" class="nav-link">Go Live</a></li>
                <li class="nav-item auth-link-login"><a href="login.html" class="nav-link">Login</a></li>
                <li class="nav-item auth-link-register"><a href="register.html" class="nav-link">Register</a></li>
                <!-- Logout link and user info will be added dynamically later -->
            </ul>
        </div>
    </nav>
    <div class="page-container">
        <div class="content-section">
            <div class="section-header">
                <h2>Active Streams</h2>
                <button id="refreshStreamsButton" class="btn" style="margin-bottom: 0;">Refresh List</button> <!-- Adjusted margin -->
            </div>
            <div id="activeStreamsList" class="stream-cards-grid"> <!-- Changed ul to div and added class -->
                <p>Loading active streams...</p> <!-- Changed li to p for initial message -->
            </div>
        </div>

        <div class="content-section">
            <h2>Join a Live Stream by ID</h2>
            <div class="join-stream-form"> <!-- Wrapped input and button -->
                <label for="streamIdInput" class="sr-only">Stream ID:</label> <!-- Screen-reader only label -->
                <input type="text" id="streamIdInput" placeholder="Enter Stream ID">
                <button id="joinStreamButton" class="btn" disabled>Join Stream</button>
            </div>
        </div>

        <div class="content-section">
            <h2>Playback</h2>
            <div id="statusMessages" class="message-feedback">Connecting to server...</div>
            <audio id="audioPlayback" controls style="margin-top: var(--spacing-unit); width: 100%;"></audio>
        </div>

        <div class="content-section">
            <h3>Live Chat</h3>
            <div id="chatMessages" class="chat-messages-area">
                <!-- Chat messages will appear here -->
            </div>
            <form id="chatForm" class="chat-input-form">
                <input type="text" id="chatInput" placeholder="Say something..." autocomplete="off" required>
                <button type="submit" class="btn">Send</button>
            </form>
        </div>
    </div>

    <script src="listener.js"></script>
    <script src="/js/nav.js" defer></script>
</body>
</html>
