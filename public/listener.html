<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beachouse - Watch a Stream</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Inline styles removed -->
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="listener.html" class="nav-brand">Beachouse</a>
            <ul class="nav-links">
                <li class="nav-item"><a href="listener.html" class="nav-link">Listen</a></li>
                <li class="nav-item"><a href="broadcaster.html" class="nav-link">Go Live</a></li>
                <li class="nav-item auth-link-login"><a href="login.html" class="nav-link">Login</a></li>
                <li class="nav-item auth-link-register"><a href="register.html" class="nav-link">Register</a></li>
                <!-- Logout link and user info will be added dynamically later -->
            </ul>
        </div>
    </nav>
    <div class="page-container">
        <div class="content-section">
            <h2>Active Streams</h2>
            <button id="refreshStreamsButton" class="btn" style="margin-bottom: var(--spacing-unit);">Refresh List</button>
            <ul id="activeStreamsList">
                <li>Loading active streams...</li>
            </ul>
        </div>

        <div class="content-section">
            <h2>Join a Live Stream by ID</h2>
            <div> <!-- Added div for better label-input grouping if needed -->
                <label for="streamIdInput">Stream ID:</label>
                <input type="text" id="streamIdInput" placeholder="Enter Stream ID">
            </div>
            <button id="joinStreamButton" class="btn" disabled>Join Stream</button>
        </div>

        <div class="content-section">
            <h2>Playback</h2>
            <div id="statusMessages" class="message-feedback">Connecting to server...</div>
            <audio id="audioPlayback" controls style="margin-top: var(--spacing-unit); width: 100%;"></audio>
        </div>
    </div>

    <script src="listener.js"></script>
    <script src="/js/nav.js" defer></script>
</body>
</html>
